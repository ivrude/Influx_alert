<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfluxDB Data Sender</title>
    <style>
        table {
            width: 50%;
            margin: auto;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        td:first-child {
            font-weight: bold;
            background-color: #eaeaea;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Внесення ручних вимірів</h1>
    <form action="/" method="POST">
        <table>
            <tr>
                <th>Поле</th>
                <th>Значення</th>
            </tr>
            <tr>
                <td>Кузов</td>
                <td><input type="float" name="body" required></td>
            </tr>
            <tr>
                <td>Колеса</td>
                <td><input type="float" name="wheels" required></td>
            </tr>
            <tr>
                <td>Дно машини</td>
                <td><input type="float" name="bottom" required></td>
            </tr>
        </table>
        <div style="text-align: center; margin-top: 20px;">
            <button type="submit">Відправити</button>
        </div>
    </form>
</body>
</html>
