<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
    <title>Моніторинг</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100vh;
            width: 100vw;
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 30pt;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        table {
            width: 100%;
            height: 100%;
            text-align: center;
            position: relative;
        }
        .green_block {
            background-color: #4CAF50;
            position: relative;
        }
        .red_block {
            background-color: #FF0000 !important;
            color: white;
        }
        .gray_block {
            background-color: #666;
            position: relative;
        }
        .title {
            font-size: 14pt;
            font-weight: bold;
            color: #fff;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 10px;
        }
        td {
            padding-top: 40px;
        }
    </style>
    <script>
        function updateData() {
        fetch('/latest_data')
            .then(response => response.json())
            .then(data => {
                if (data) {
                    updateCell("current_amount_1", data.curent_amount_1);
                    updateCell("current_amount_2", data.curent_amount_2);
                    updateCell("current_amount_3", data.curent_amount_3);
                    updateCell("current_amount_4", data.curent_amount_4);

                    updateCell("state_amount_1", data.state_amount_1);
                    updateCell("state_amount_2", data.state_amount_2);
                    updateCell("state_amount_3", data.state_amount_3);
                    updateCell("state_amount_4", data.state_amount_4);

                    updateTrigger("triger_1", data.triger_1);
                    updateTrigger("triger_2", data.triger_2);
                    updateTrigger("triger_3", data.triger_3);
                    updateTrigger("triger_4", data.triger_4);

                    updateRadiometer("radiometr_state", data.radiometr_state);
                }
            })
            .catch(error => console.error('Помилка отримання даних:', error));
    }
    function sendAlert(ip, payload) {
    fetch(`http://${ip}/webhook2`, {
        method: 'GET',
    })
    .then(response => {
        if (!response.ok) {
            console.error('POST-запит не вдався:', response.statusText);
        }
    })
    .catch(error => console.error('Помилка POST-запиту:', error));
}


    function updateCell(id, value) {
        document.getElementById(id).innerText = value.toFixed(2);
    }

    function updateTrigger(id, value) {
        let cell = document.getElementById(id).parentElement;
        if (value == 1) {
            cell.style.backgroundColor = "red";
            document.getElementById(id).innerText = "Тривога";
            sendAlert('192.168.0.43:8000', { sensor: id, status: 'alarm' });
        } else {
            cell.style.backgroundColor = "#4CAF50"; // зелений
            document.getElementById(id).innerText = `БД ${id.replace("triger_", "")}`;
        }
    }

    function updateRadiometer(id, value) {
        let cell = document.getElementById(id).parentElement;
        if (value == 1) {
            cell.style.backgroundColor = "red";
            document.getElementById(id).innerText = "Помилка";
            sendAlert('192.168.0.43:8000', { device: 'radiometer', status: 'error' });
        } else {
            cell.style.backgroundColor = "#4CAF50"; // зелений
            document.getElementById(id).innerText = `Норма`;
        }
    }

    setInterval(updateData, 1000);
    window.onload = updateData;

    </script>
</head>
<body>
    <table width="100%" height="100%">
        <tr>
            <td style="width: 10%" class="gray_block">
                <div class="title">Поточне значення 3</div>
                <div id="current_amount_3"></div>
            </td>
            <td style="width: 10%" rowspan="2" class="green_block" id="triger_3_cell">
                <div class="title">Стан датчика 3</div>
                <div id="triger_3"></div>
            </td>
            <td style="width: 50%; height: 100%;" rowspan="3">
                <div class="title">Камера</div>
                <iframe id="camera_feed" src="http://192.168.0.43:8888/video_feed"
                    style="width: 100%; height: calc(100% - 40px); border: none; display: block;"></iframe>
            </td>

            <td style="width: 10%" rowspan="2" class="green_block" id="triger_4_cell">
                <div class="title">Стан датчика 4</div>
                <div id="triger_4"></div>
            </td>
            <td style="width: 10%" class="gray_block">
                <div class="title">Поточне значення 4</div>
                <div id="current_amount_4"></div>
            </td>
        </tr>
        <tr>
            <td style="width: 10%" class="gray_block">
                <div class="title">Стале значення фону 3</div>
                <div id="state_amount_3"></div>
            </td>
            <td style="width: 10%" class="gray_block">
                <div class="title">Стале значення фону 4</div>
                <div id="state_amount_4"></div>
            </td>
        </tr>
        <tr>
            <td style="width: 10%" class="gray_block">
                <div class="title">Поточне значення 1</div>
                <div id="current_amount_1"></div>
            </td>
            <td style="width: 10%" rowspan="2" class="green_block" id="triger_1_cell">
                <div class="title">Стан датчика 1</div>
                <div id="triger_1"></div>
            </td>
            <td style="width: 10%" rowspan="2" class="green_block" id="triger_2_cell">
                <div class="title">Стан датчика 2</div>
                <div id="triger_2"></div>
            </td>
            <td style="width: 10%" class="gray_block">
                <div class="title">Поточне значення 2</div>
                <div id="current_amount_2"></div>
            </td>
        </tr>
        <tr>
            <td style="width: 10%" class="gray_block">
                <div class="title">Стале значення фону 1</div>
                <div id="state_amount_1"></div>
            </td>
            <td style="width: 50%" class="green_block">
                <div class="title">Статус радіометра</div>
                <div id="radiometr_state"></div>
            </td>
            <td style="width: 10%" class="gray_block">
                <div class="title">Стале значення фону 2</div>
                <div id="state_amount_2"></div>
            </td>
        </tr>
    </table>
</body>
</html>
